<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection Fence</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1 data-i18n="popupTitle">Selection Fence</h1>
    <p class="subtitle" data-i18n="popupSubtitle"></p>
    <p class="mode-note" data-i18n="modeDifferenceNote"></p>

    <form id="mode-form">
      <label class="option">
        <input type="radio" name="clampMode" value="smart">
        <span>
          <strong data-i18n="modeSmart"></strong>
          <small data-i18n="modeSmartDesc"></small>
        </span>
      </label>
      <label class="option">
        <input type="radio" name="clampMode" value="nearest">
        <span>
          <strong data-i18n="modeNearest"></strong>
          <small data-i18n="modeNearestDesc"></small>
        </span>
      </label>
      <label class="option">
        <input type="radio" name="clampMode" value="block">
        <span>
          <strong data-i18n="modeBlock"></strong>
          <small data-i18n="modeBlockDesc"></small>
        </span>
      </label>
    </form>

    <p class="mode-note" data-i18n="altBypassNote"></p>
    <p class="note" data-i18n="sensitiveNote"></p>
    <p class="privacy" data-i18n="privacyNote"></p>
    <details class="diagnostics" id="diagnostics-section">
      <summary data-i18n="diagnosticsTitle"></summary>
      <label class="diagnostics-toggle">
        <input type="checkbox" id="diagnostics-enabled" disabled>
        <span data-i18n="diagnosticsEnable"></span>
      </label>
      <p class="mode-note" data-i18n="diagnosticsDescription"></p>
      <div class="diagnostics-actions">
        <button type="button" id="diagnostics-show" data-i18n="diagnosticsShow"></button>
        <button type="button" id="diagnostics-copy" data-i18n="diagnosticsCopy" disabled></button>
        <button type="button" id="diagnostics-clear" data-i18n="diagnosticsClear"></button>
      </div>
      <label for="diagnostics-log" class="log-label" data-i18n="diagnosticsLogLabel" hidden></label>
      <textarea id="diagnostics-log" rows="8" readonly spellcheck="false" hidden></textarea>
      <p id="diagnostics-status" role="status" aria-live="polite"></p>
    </details>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
